name: Build public Repository-as-State paper

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'paper/**'
      - '.github/workflows/build-paper.yml'

permissions:
  contents: write

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Clone publication repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" work

      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-pictures texlive-bibtex-extra poppler-utils

      - name: Build and verify PDF
        run: |
          cd work/paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          cd ..
          test -s paper/main.pdf
          cp paper/main.pdf Repository-as-State-v1.0.0.pdf
          sha256sum Repository-as-State-v1.0.0.pdf > Repository-as-State-v1.0.0.pdf.sha256
          pdfinfo Repository-as-State-v1.0.0.pdf | grep '^Pages:'

      - name: Publish generated PDF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd work
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Repository-as-State-v1.0.0.pdf Repository-as-State-v1.0.0.pdf.sha256
          git diff --cached --quiet && exit 0
          git commit -m 'Publish Repository-as-State v1.0.0 PDF'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
